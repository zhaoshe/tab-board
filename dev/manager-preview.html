<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabBoard Manager Preview</title>
  </head>
  <body style="margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module">
      import { installPreviewChrome } from '/src/dev/previewChrome.ts';

      // Tests (and manual exploration) can seed deterministic preview state by
      // setting `window.__TABBOARD_PREVIEW__` before this module runs (e.g. via
      // Playwright addInitScript); installPreviewChrome() reads it as defaults.
      installPreviewChrome();
      await import('/src/manager/main.tsx');
    </script>
  </body>
</html>
