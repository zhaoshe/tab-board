<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZipTab Share</title>
    <link rel="stylesheet" href="src/styles.css" />
    <link rel="stylesheet" href="src/share.css" />
  </head>
  <body class="share-body">
    <main class="share-shell">
      <header class="share-header">
        <div>
          <p class="eyebrow">Shared tabs</p>
          <h1>ZipTab Share</h1>
        </div>
        <div class="header-actions">
          <button type="button" data-action="copy">Copy links</button>
          <button type="button" data-action="download">Download HTML</button>
        </div>
      </header>
      <section id="shareContent" class="share-content"></section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="src/share.js"></script>
  </body>
</html>
